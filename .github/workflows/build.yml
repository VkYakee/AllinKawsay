name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo del lanzamiento'
        required: false
        default: ''
  push:
    branches: [3.0]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Expose NDK
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install JS deps
        run: |
          if [ -f package-lock.json ]; then
            echo "🔒 Lockfile encontrado → npm ci"
            npm ci
          else
            echo "📦 Sin lockfile → npm install"
            npm install --no-audit --no-fund
          fi

      - name: Generate app icons
        run: |
          set -e
          mkdir -p src-tauri/icons
          echo "🎨 Generando iconos"
          npm run tauri icon assets/logo.png || true
          if [ ! -f src-tauri/icons/32x32.png ]; then
            echo "⚠️ Fallback: creando iconos con ImageMagick"
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert assets/logo.png -resize 32x32 src-tauri/icons/32x32.png
            convert assets/logo.png -resize 128x128 src-tauri/icons/128x128.png
            convert assets/logo.png -resize 256x256 src-tauri/icons/128x128@2x.png
            convert assets/logo.png -resize 512x512 src-tauri/icons/icon.png
            convert assets/logo.png -resize 256x256 src-tauri/icons/icon.ico
          fi

      - name: Init Tauri Android
        run: npm run tauri android init

      - name: Apply signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/allinkawsay.keystore
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=allinkawsay.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          python3 <<'PYEOF'
          import re
          path = 'src-tauri/gen/android/app/build.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()

          header = '''import java.util.Properties
          import java.io.FileInputStream

          val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = Properties().apply {
              if (keystorePropertiesFile.exists()) {
                  load(FileInputStream(keystorePropertiesFile))
              }
          }

          '''
          if 'val keystorePropertiesFile' not in content:
              content = header + content

          signing = '''    signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                          storeFile = file("allinkawsay.keystore")
                          storePassword = keystoreProperties["storePassword"] as String
                      }
                  }
              }
          '''
          if 'signingConfigs' not in content:
              content = re.sub(r'(android\s*\{)', r'\1\n' + signing, content, count=1)

          if 'signingConfig = signingConfigs.getByName("release")' not in content:
              content = re.sub(
                  r'(getByName\("release"\)\s*\{)',
                  r'\1\n                signingConfig = signingConfigs.getByName("release")',
                  content, count=1
              )

          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Locate APK
        id: apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then echo "❌ No APK encontrado"; exit 1; fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT

      - name: Package APK
        run: |
          mkdir -p dist-apk
          cp "${{ steps.apk.outputs.path }}" dist-apk/AllinKawsay.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-rust-${{ github.run_number }}
          name: v3.0.0-rust-${{ github.run_number }}
          body: |
            🚀 Nueva versión Rust/Tauri

            - **Build:** ${{ github.run_number }}
            - **Tamaño:** ${{ steps.apk.outputs.size_mb }} MB
            - **Commit:** ${{ github.sha }}
            - **Fecha:** $(date +'%Y-%m-%d %H:%M UTC')

            ${{ github.event.inputs.motivo }}
          files: dist-apk/AllinKawsay.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}