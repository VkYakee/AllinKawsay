name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo del lanzamiento'
        required: false
        default: ''
  push:
    branches: [3.0]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Expose NDK
        run: echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install JS deps
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile encontrado - npm ci"
            npm ci
          else
            echo "Sin lockfile - npm install"
            npm install --no-audit --no-fund
          fi

      - name: Generate app icons
        run: |
          set -e
          mkdir -p src-tauri/icons assets
          LOGO=""
          for candidate in assets/logo.png android_config/icono.png docs/logo.png; do
            if [ -f "$candidate" ]; then LOGO="$candidate"; break; fi
          done
          if [ -z "$LOGO" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            convert -size 512x512 xc:'#8B1A2B' -fill '#F5D061' -pointsize 240 -gravity center -annotate 0 'AK' assets/logo.png
            LOGO="assets/logo.png"
          fi
          [ "$LOGO" != "assets/logo.png" ] && cp "$LOGO" assets/logo.png
          npm run tauri icon assets/logo.png

      - name: Init Tauri Android
        run: npm run tauri android init

      - name: Apply signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/allinkawsay.keystore"

          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/allinkawsay.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          python3 <<'PYEOF'
          import pathlib
          import re

          path = pathlib.Path('src-tauri/gen/android/app/build.gradle.kts')
          content = path.read_text()

          # ── 1. Imports necesarios (solo si faltan) ──
          for imp in ['import java.io.FileInputStream', 'import java.util.Properties']:
              if imp not in content:
                  content = imp + '\n' + content

          # ── 2. Variables fuera del bloque android ──
          if 'val keystoreProperties' not in content:
              header = '''
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = Properties().apply {
              if (keystorePropertiesFile.exists()) {
                  load(FileInputStream(keystorePropertiesFile))
              }
          }

          '''
              idx = content.find('android {')
              if idx == -1:
                  raise SystemExit('No se encontró "android {"')
              content = content[:idx] + header + content[idx:]

          # ── 3. Insertar signingConfigs DENTRO de android { }, antes de buildTypes ──
          if 'signingConfigs {' not in content:
              signing_block = '''
              signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                      }
                  }
              }
          '''
              build_types_idx = content.find('buildTypes {')
              if build_types_idx == -1:
                  raise SystemExit('No se encontró "buildTypes {"')

              # Retroceder hasta la llave de apertura de android { }
              android_start = content.rfind('android {', 0, build_types_idx)
              if android_start == -1:
                  raise SystemExit('No se encontró "android {" antes de "buildTypes {"')

              # Insertar justo antes de buildTypes
              content = (
                  content[:build_types_idx]
                  + signing_block
                  + content[build_types_idx:]
              )

          # ── 4. Activar signing en release ──
          if 'signingConfig = signingConfigs.getByName("release")' not in content:
              release_match = re.search(
                  r'getByName\("release"\)\s*\{',
                  content
              )
              if release_match:
                  insert_pos = release_match.end()
                  content = (
                      content[:insert_pos]
                      + '\n                signingConfig = signingConfigs.getByName("release")'
                      + content[insert_pos:]
                  )

          path.write_text(content)

          print('✅ build.gradle.kts parcheado')
          print('--- Primeras 40 líneas ---')
          print('\n'.join(content.splitlines()[:40]))
          PYEOF

      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Locate APK
        id: apk
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then echo "No APK encontrado"; exit 1; fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT

      - name: Package APK
        run: |
          mkdir -p dist-apk
          cp "${{ steps.apk.outputs.path }}" dist-apk/AllinKawsay.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-rust-${{ github.run_number }}
          name: v3.0.0-rust-${{ github.run_number }}
          body: |
            Nueva version Rust/Tauri

            - **Build:** ${{ github.run_number }}
            - **Tamano:** ${{ steps.apk.outputs.size_mb }} MB
            - **Commit:** ${{ github.sha }}
          files: dist-apk/AllinKawsay.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}