name: Build APK

on:
  push:
    branches: [ main, experimental/zampona ]
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo del lanzamiento (ej: nuevas features, fix importante)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Instalar ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Bootstrap Android project
        run: |
          rm -rf android/
          flutter create . --org com.allinkawsay --platforms android --project-name allinkawsay_app

      - name: Aplicar config Android con Firebase
        run: |
          cp android_config/settings.gradle android/settings.gradle
          cp android_config/build.gradle android/build.gradle
          cp android_config/app/build.gradle android/app/build.gradle
          cp android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp firebase/google-services.json android/app/google-services.json

          mkdir -p android/app/src/main/res/xml
          cp android_config/file_paths.xml android/app/src/main/res/xml/file_paths.xml

          mkdir -p android/app/src/main/res/drawable-mdpi
          mkdir -p android/app/src/main/res/drawable-hdpi
          mkdir -p android/app/src/main/res/drawable-xhdpi
          mkdir -p android/app/src/main/res/drawable-xxhdpi
          mkdir -p android/app/src/main/res/drawable-xxxhdpi
          cp android_config/res/drawable-mdpi/ic_stat_notify.png android/app/src/main/res/drawable-mdpi/
          cp android_config/res/drawable-hdpi/ic_stat_notify.png android/app/src/main/res/drawable-hdpi/
          cp android_config/res/drawable-xhdpi/ic_stat_notify.png android/app/src/main/res/drawable-xhdpi/
          cp android_config/res/drawable-xxhdpi/ic_stat_notify.png android/app/src/main/res/drawable-xxhdpi/
          cp android_config/res/drawable-xxxhdpi/ic_stat_notify.png android/app/src/main/res/drawable-xxxhdpi/
          cp android_config/res/drawable-mdpi/ic_notify_large.png android/app/src/main/res/drawable-mdpi/
          cp android_config/res/drawable-hdpi/ic_notify_large.png android/app/src/main/res/drawable-hdpi/
          cp android_config/res/drawable-xhdpi/ic_notify_large.png android/app/src/main/res/drawable-xhdpi/
          cp android_config/res/drawable-xxhdpi/ic_notify_large.png android/app/src/main/res/drawable-xxhdpi/
          cp android_config/res/drawable-xxxhdpi/ic_notify_large.png android/app/src/main/res/drawable-xxxhdpi/

      - name: Aplicar MainActivity custom
        run: |
          if [ -f "android_config/MainActivity.kt" ]; then
            find android/app/src/main -name "MainActivity.java" -delete || true
            find android/app/src/main -name "MainActivity.kt" -delete || true
            mkdir -p android/app/src/main/kotlin/com/allinkawsay/app
            cp android_config/MainActivity.kt \
              android/app/src/main/kotlin/com/allinkawsay/app/MainActivity.kt
            echo "✅ MainActivity custom copiado"
          fi

      - name: Configurar keystore de release desde Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/allinkawsay.keystore

          cat > android/keystore.properties << EOF
          storeFile=allinkawsay.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "✅ Keystore de release configurado desde Secrets"

      - name: Mostrar SHA-1 del keystore (para verificar)
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  SHA-1 del keystore de release"
          echo "═══════════════════════════════════════════════════════"
          keytool -list -v \
            -keystore android/app/allinkawsay.keystore \
            -alias allinkawsay \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>/dev/null | grep -E "SHA1:|SHA-256:" || echo "⚠️ No se pudo leer SHA-1"
          echo "═══════════════════════════════════════════════════════"

      - name: Preparar assets
        run: |
          mkdir -p assets
          if [ -f "android_config/icono.png" ]; then
            cp android_config/icono.png assets/logo.png
          fi

      - name: Generar íconos del lanzador
        run: |
          if [ -f "android_config/icono.png" ]; then
            if command -v magick &> /dev/null; then
              CONVERT="magick"
            else
              CONVERT="convert"
            fi
            $CONVERT android_config/icono.png -resize 48x48 \
              android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            $CONVERT android_config/icono.png -resize 72x72 \
              android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            $CONVERT android_config/icono.png -resize 96x96 \
              android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            $CONVERT android_config/icono.png -resize 144x144 \
              android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            $CONVERT android_config/icono.png -resize 192x192 \
              android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Generar archivo de versión
        run: |
          RUN=${{ github.run_number }}
          echo "🔢 Build number: $RUN"
          cat > lib/version_build.dart << EOF
          // ⚠️ Este archivo es generado automáticamente por GitHub Actions.
          // NO EDITAR MANUALMENTE.

          class VersionBuild {
            static const int build = $RUN;
          }
          EOF
          echo "✅ version_build.dart generado:"
          cat lib/version_build.dart

      - name: Leer versión de version.dart
        id: version
        run: |
          MAJOR=$(awk -F"'" '/static const String major/ {print $2; exit}' lib/version.dart | tr -d '[:space:]')
          MINOR=$(awk -F"'" '/static const String minor/ {print $2; exit}' lib/version.dart | tr -d '[:space:]')
          PATCH=$(awk -F"'" '/static const String patch/ {print $2; exit}' lib/version.dart | tr -d '[:space:]')
          RELEASE=$(awk -F"'" '/static const String release/ {print $2; exit}' lib/version.dart | tr -d '[:space:]')

          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ] || [ -z "$RELEASE" ]; then
            echo "❌ No se pudieron leer las versiones. Revisá lib/version.dart"
            exit 1
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}.${RELEASE}"
          echo "📦 Versión base detectada: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determinar tipo de release
        id: tipo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🎯 Lanzamiento MANUAL → release estable"
            echo "es_prerelease=false" >> $GITHUB_OUTPUT
            echo "emoji=🚀" >> $GITHUB_OUTPUT
            echo "etiqueta=LANZAMIENTO OFICIAL" >> $GITHUB_OUTPUT
          else
            echo "🔨 Push automático → prerelease"
            echo "es_prerelease=true" >> $GITHUB_OUTPUT
            echo "emoji=🔬" >> $GITHUB_OUTPUT
            echo "etiqueta=BUILD DE PRUEBA" >> $GITHUB_OUTPUT
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          RUN=${{ github.run_number }}
          VERSION=${{ steps.version.outputs.version }}
          echo "🔨 Compilando ${VERSION}.${RUN}"
          flutter build apk --release \
            --build-name=${VERSION}.${RUN} \
            --build-number=$RUN \
            --dart-define=ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}

      - name: Verificar APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          APK_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          echo "📱 Tamaño del APK: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 5000000 ]; then
            echo "⚠️ APK muy pequeño"
            exit 1
          fi

      - name: Renombrar APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/AllinKawsay.apk
          echo "✅ APK renombrado a AllinKawsay.apk"

      - name: Upload APK (artifact de Actions)
        uses: actions/upload-artifact@v4
        with:
          name: allinkawsay-apk-v${{ steps.version.outputs.version }}.${{ github.run_number }}
          path: build/app/outputs/flutter-apk/AllinKawsay.apk

      - name: Crear release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=${{ github.run_number }}
          VERSION=${{ steps.version.outputs.version }}
          TAG="v${VERSION}.${RUN}"
          APK="build/app/outputs/flutter-apk/AllinKawsay.apk"
          SIZE=$(stat -c%s $APK)
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
          MOTIVO="${{ github.event.inputs.motivo }}"
          TIPO="${{ steps.tipo.outputs.etiqueta }}"
          EMOJI="${{ steps.tipo.outputs.emoji }}"

          cat > /tmp/notas.md <<EOF
          ${EMOJI} **${TIPO}**

          - **Versión:** ${VERSION}.${RUN}
          - **Build number:** ${RUN}
          - **Tamaño:** ${SIZE_MB} MB
          - **Commit:** ${{ github.sha }}
          - **Fecha:** $(date +'%Y-%m-%d %H:%M UTC')

          ${MOTIVO:+**Motivo:** ${MOTIVO}}
          EOF

          if [ "${{ steps.tipo.outputs.es_prerelease }}" = "true" ]; then
            gh release create "$TAG" "$APK" \
              --title "v${VERSION}.${RUN} (prueba)" \
              --notes-file /tmp/notas.md \
              --prerelease
            echo "✅ Prerelease creada: $TAG"
          else
            gh release create "$TAG" "$APK" \
              --title "v${VERSION}.${RUN}" \
              --notes-file /tmp/notas.md
            echo "✅ Release ESTABLE creado: $TAG"
            echo "📥 Link de descarga directa:"
            echo "https://github.com/yeo-drake/AllinKawsay/releases/latest/download/AllinKawsay.apk"
          fi