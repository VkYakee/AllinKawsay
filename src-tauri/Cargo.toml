# src-tauri/Cargo.toml
[package]
name = "allin-kawsay"
version = "3.0.0"
edition = "2021"
rust-version = "1.77"
authors = ["C.I.A.C. Allin Kawsay"]
description = "App oficial del grupo Allin Kawsay - Juliaca, Perú"

[lib]
name = "allin_kawsay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rodio = { version = "0.19", default-features = false, features = ["playback", "symphonia-vorbis", "symphonia-mp3", "oboe-shared-stdcxx"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"